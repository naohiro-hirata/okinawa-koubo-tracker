name: Scrape Okinawa koubo/nyusatsu info

on:
  schedule:
    # UTC 23:00 = JST 08:00 (翌日)
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # Actionsタブから手動実行もできるようにする

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated data.json
        run: |
          git config user.name "koubo-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update data.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
